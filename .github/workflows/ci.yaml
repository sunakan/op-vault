name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: fmt/lint
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install mise
        run: curl -sSfL https://mise.run | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
      - name: Install C lint tools
        run: brew install cppcheck llvm
      - name: Run make fmt
        run: make fmt
      - name: Check no diff
        run: git diff --exit-code
      - name: Run make lint
        run: make lint

  unit:
    name: unit
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run make test
        run: make test

  e2e:
    name: e2e
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_YES: "1"
      MISE_ENV: ci
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install mise
        run: curl -sSfL https://mise.run | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.ci.toml') }}
      - name: Install mise tools
        run: mise install
      - name: Run E2E tests
        run: make e2e-test
