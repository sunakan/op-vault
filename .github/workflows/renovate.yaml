name: Renovate

on:
  schedule:
    - cron: "0 1 * * *" # daily 10:00 JST (UTC 01:00)
  workflow_dispatch:
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_PRIVATE_KEY }}
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          RENOVATE_REPOSITORIES: sunakan/op-vault
        with:
          token: ${{ steps.app-token.outputs.token }}
